[package]
name = "aiis-clef"
version = "0.7.5"
edition = "2021"
license = "MIT"
description = "AI inference server for the Clef decision model: the SystemOne contract, CUDA, no Python in the path"
repository = "https://github.com/ronaldslc/aiis-clef"
readme = "README.md"

[[bin]]
name = "aiis-clef"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ntex = { version = "3.12", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "process", "net"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
safetensors = "0.8"
base64 = "0.22"
cudarc = { version = "0.19", features = ["driver", "cuda-13030", "std"] }
hf-hub = { version = "0.5", default-features = false, features = ["ureq", "rustls-tls"] }
memmap2 = "0.9"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
debug = 1
strip = "debuginfo"
